<!doctype html>
<html lang="zh-CN" data-role="workspace" data-polish="on" style="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>当前首页 · 视觉精修对比</title>
    <style id="currentStyles">
      :root {
        color: var(--textPrimary);
        background: var(--appBackground);
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      * {
        box-sizing: border-box;
      }
      body {
        user-select: none;
        cursor: default;
        margin: 0px;
      }
      .artifact-blocks,
      .source-card blockquote,
      .translated,
      .focus-title,
      .focus-summary,
      .calculation-result,
      .meeting-review ul,
      .selectable-text,
      [role='alert'],
      input,
      textarea,
      [contenteditable='true'] {
        user-select: text;
      }
      button,
      summary,
      label,
      .provenance {
        user-select: none;
      }
      button svg {
        pointer-events: none;
      }
      select,
      summary,
      label.check {
        cursor: pointer;
      }
      select[aria-disabled='true'] {
        cursor: progress;
      }
      .settings-field-hint {
        color: var(--textSecondary);
        margin: -4px 0px 18px;
        font-size: 13px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--controlBorder);
        background: var(--contentSurface);
        cursor: pointer;
        border-radius: 10px;
        justify-content: center;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 8px 14px;
        font-weight: 500;
        line-height: 1.4;
        transition:
          background-color 0.15s,
          border-color 0.15s;
        display: inline-flex;
      }
      button svg {
        flex-shrink: 0;
      }
      button:hover:not(:disabled) {
        background: var(--subtleSurface);
        border-color: var(--textSecondary);
      }
      button:disabled {
        color: var(--disabledText);
        opacity: 0.65;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .primary {
        background: var(--accent);
        color: rgb(255, 255, 255);
        border-color: var(--accent);
        min-height: 44px;
        padding: 10px 20px;
        box-shadow: rgba(16, 24, 40, 0.05) 0px 1px 2px;
      }
      .primary:hover:not(:disabled) {
        background: rgb(29, 82, 183);
        border-color: rgb(29, 82, 183);
      }
      .primary:disabled {
        color: rgb(255, 255, 255);
      }
      .danger {
        color: var(--error);
        background: var(--errorSurface);
        border-color: rgba(0, 0, 0, 0);
      }
      .danger:hover:not(:disabled) {
        border-color: var(--error);
        background: var(--errorSurface);
      }
      .text-button,
      .source-link,
      .cite {
        color: var(--accent);
        box-shadow: none;
        background: 0px 0px;
        border-color: rgba(0, 0, 0, 0);
        padding: 6px 8px;
      }
      .text-button:hover,
      .source-link:hover,
      .cite:hover {
        background: var(--accentSubtle);
        border-color: rgba(0, 0, 0, 0);
      }
      .source-link {
        min-height: 30px;
        font-size: 13px;
      }
      .cite {
        float: right;
        min-height: 28px;
        padding: 2px 6px;
      }
      h1 {
        letter-spacing: -0.8px;
        overflow-wrap: anywhere;
        margin: 14px 0px 16px;
        font-size: 32px;
        font-weight: 600;
        line-height: 1.25;
      }
      h2 {
        letter-spacing: -0.35px;
        margin: 0px 0px 12px;
        font-size: 21px;
        font-weight: 600;
        line-height: 1.35;
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 8px 0px 16px;
      }
      small,
      .muted,
      .eyebrow,
      .section-label {
        color: var(--textTertiary);
      }
      small,
      .eyebrow,
      .section-label {
        font-size: 12px;
      }
      .eyebrow,
      .section-label {
        align-items: center;
        gap: 8px;
        display: flex;
      }
      .lead {
        color: var(--textSecondary);
        max-width: 760px;
        font-size: 17px;
        line-height: 1.7;
      }
      .app-shell {
        min-height: 100vh;
        padding-bottom: 48px;
      }
      .toolbar {
        border-bottom: 1px solid var(--divider);
        background: var(--contentSurface);
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        min-height: 64px;
        padding: 12px 28px;
        display: flex;
      }
      .brand {
        letter-spacing: -0.3px;
        white-space: nowrap;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        display: flex;
      }
      .brand-mark {
        background: var(--accent);
        color: rgb(255, 255, 255);
        border-radius: 10px;
        place-items: center;
        width: 32px;
        height: 32px;
        display: grid;
      }
      .brand-subtitle {
        color: var(--textTertiary);
        border-left: 1px solid var(--divider);
        font-size: 12px;
      }
      .toolbar-divider {
        border-left: 1px solid var(--divider);
        height: 20px;
      }
      .meeting-name {
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
        max-width: 350px;
        color: var(--textPrimary);
        font-weight: 600;
        display: block;
        overflow: hidden;
      }
      .back-button {
        color: var(--textSecondary);
      }
      .toolbar-actions {
        align-items: center;
        gap: 8px;
        margin-left: auto;
        display: flex;
      }
      .toolbar-actions > .text-button {
        color: var(--textSecondary);
        width: 36px;
        padding: 8px;
      }
      .status {
        color: var(--textSecondary);
        background: var(--subtleSurface);
        white-space: nowrap;
        border-radius: 6px;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
      }
      .status-capturing {
        color: var(--listening);
        background: var(--successSurface);
      }
      .status-paused,
      .status-starting {
        color: var(--warning);
        background: var(--warningSurface);
      }
      .status-input_error {
        color: var(--error);
        background: var(--errorSurface);
      }
      .dot {
        background: var(--textTertiary);
        border-radius: 50%;
        flex-shrink: 0;
        width: 6px;
        height: 6px;
        display: inline-block;
      }
      .dot.capturing {
        background: var(--listening);
      }
      .dot.paused,
      .dot.starting {
        background: var(--warning);
      }
      .dot.input_error {
        background: var(--error);
      }
      .library {
        max-width: 1120px;
        margin: auto;
        padding: 48px 32px 40px;
      }
      .home-hero {
        border: 1px solid var(--divider);
        background: var(--contentSurface);
        border-radius: 18px;
        padding: 44px 48px 36px;
        box-shadow: rgba(16, 24, 40, 0.008) 0px 2px 5px;
      }
      .hero-kicker {
        color: var(--accent);
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
      }
      .home-hero h1 {
        max-width: 660px;
        margin-top: 0px;
      }
      .home-hero .lead {
        max-width: 650px;
        margin: 0px;
      }
      .start-row {
        flex-wrap: wrap;
        align-items: center;
        gap: 28px;
        margin-top: 30px;
        display: flex;
      }
      .start-button {
        gap: 12px;
        min-height: 48px;
        padding: 12px 22px;
      }
      .start-button svg:last-child {
        margin-left: 16px;
      }
      .device-summary {
        color: var(--textSecondary);
        font-size: 13px;
      }
      .device-summary > div {
        align-items: center;
        gap: 7px;
        display: flex;
      }
      .device-summary .source-link {
        min-height: 26px;
        color: var(--textTertiary);
        gap: 6px;
        padding: 2px 0px;
        font-size: 12px;
      }
      .hero-footnote {
        color: var(--textTertiary);
        margin: 24px 0px 0px;
        font-size: 12px;
      }
      .setup-note {
        background: var(--warningSurface);
        color: var(--warning);
        border-radius: 10px;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 20px 0px;
        padding: 16px 20px;
        font-size: 13px;
        display: flex;
      }
      .setup-note strong {
        font-weight: 600;
      }
      .setup-note p {
        flex: 1 1 0%;
        min-width: 200px;
        margin: 0px;
      }
      .setup-note .source-link {
        color: var(--warning);
      }
      .recent-meetings {
        margin-top: 40px;
      }
      .recent-heading {
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 0px 2px 16px;
        display: flex;
      }
      .recent-heading h2 {
        margin: 0px;
        font-size: 18px;
      }
      .recent-heading > span {
        color: var(--textTertiary);
        font-size: 12px;
      }
      .meeting-list {
        background: var(--contentSurface);
        border: 1px solid var(--divider);
        border-radius: 14px;
        overflow: hidden;
      }
      .meeting-row {
        border-top: 0px;
        border-right: 0px;
        border-left: 0px;
        border-image: none;
        border-bottom: 1px solid var(--subtleDivider);
        text-align: left;
        border-radius: 0px;
        justify-content: flex-start;
        gap: 18px;
        width: 100%;
        min-height: 88px;
        padding: 20px 24px;
      }
      .meeting-row:last-child {
        border-bottom: 0px;
      }
      .meeting-row:hover {
        background: var(--selectedSurface);
      }
      .meeting-file,
      .quiet-icon {
        width: 42px;
        height: 44px;
        color: var(--textTertiary);
        background: var(--subtleSurface);
        border: 1px solid var(--subtleDivider);
        border-radius: 10px;
        flex-shrink: 0;
        place-items: center;
        display: grid;
      }
      .meeting-file.is-active {
        color: var(--accent);
        background: var(--accentSubtle);
      }
      .meeting-row-content {
        flex: 1 1 0%;
        min-width: 0px;
      }
      .meeting-row strong {
        overflow-wrap: anywhere;
        font-weight: 500;
      }
      .meeting-row p {
        color: var(--textTertiary);
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin: 7px 0px 0px;
        font-size: 12px;
        font-weight: 400;
        display: flex;
      }
      .row-chevron {
        color: var(--textTertiary);
      }
      .library-empty {
        border: 1px dashed var(--divider);
        border-radius: 14px;
        align-items: center;
        gap: 18px;
        padding: 32px;
        display: flex;
      }
      .library-empty strong {
        font-size: 14px;
        font-weight: 500;
      }
      .library-empty p {
        color: var(--textTertiary);
        margin: 5px 0px 0px;
        font-size: 13px;
      }
      .library > details {
        color: var(--textTertiary);
        font-size: 12px;
      }
      .workspace-meta {
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        max-width: 1120px;
        margin: auto;
        padding: 22px 4px 16px;
        font-size: 12px;
        display: flex;
      }
      .meta-actions {
        flex-wrap: wrap;
        gap: 8px;
        display: flex;
      }
      .meta-actions button {
        color: var(--textSecondary);
        min-height: 32px;
        font-size: 12px;
      }
      .workspace {
        border: 1px solid var(--divider);
        background: var(--contentSurface);
        border-radius: 16px;
        max-width: 1120px;
        min-height: 480px;
        margin: 0px auto;
        padding: 36px 40px;
        box-shadow: rgba(16, 24, 40, 0.008) 0px 2px 5px;
      }
      .focus-label {
        color: var(--accent);
        align-items: center;
        gap: 7px;
        font-weight: 500;
        display: inline-flex;
      }
      .focus-title {
        max-width: 940px;
        margin-top: 14px;
      }
      .focus-summary {
        margin-bottom: 28px;
      }
      .artifact-blocks {
        margin-top: 32px;
      }
      .artifact-blocks.columns {
        grid-template-columns: repeat(2, minmax(0px, 1fr));
        gap: 28px;
        display: grid;
      }
      .expression {
        border-top: 1px solid var(--subtleDivider);
        min-width: 0px;
        margin-bottom: 32px;
        padding-top: 24px;
        transition: background-color 0.18s;
      }
      .expression-heading {
        justify-content: space-between;
        align-items: start;
        gap: 16px;
        display: flex;
      }
      .expression-heading h2 {
        margin: 0px;
        font-size: 20px;
      }
      .expression-heading .source-link {
        flex-shrink: 0;
        margin-top: -3px;
      }
      .provenance {
        color: var(--textTertiary);
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 10px 0px 20px;
        font-size: 12px;
        display: flex;
      }
      .provenance .semantic-state {
        color: var(--warning);
        background: var(--warningSurface);
        border-radius: 5px;
        padding: 2px 7px;
      }
      .provenance .state-confirmed {
        color: var(--listening);
        background: var(--successSurface);
      }
      .provenance .state-disputed {
        color: var(--error);
        background: var(--errorSurface);
      }
      .plain-list {
        padding: 0px;
        list-style: none;
      }
      .expression ul:not(.plain-list) {
        padding-left: 22px;
      }
      .expression li {
        margin-bottom: 12px;
      }
      .expression-changed {
        background-color: var(--selectedSurface);
      }
      .table-scroll {
        border: 1px solid var(--divider);
        border-radius: 10px;
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        text-align: left;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        border-bottom: 1px solid var(--subtleDivider);
        vertical-align: top;
        overflow-wrap: anywhere;
        min-width: 130px;
        padding: 16px 18px;
      }
      th {
        background: var(--subtleSurface);
        color: var(--textSecondary);
        font-weight: 600;
      }
      td:first-child {
        color: var(--textSecondary);
        font-weight: 500;
      }
      tbody tr:last-child td {
        border-bottom: 0px;
      }
      tbody tr:hover {
        background: var(--subtleSurface);
      }
      .timeline {
        padding: 0px;
        list-style: none;
      }
      .timeline li {
        border-left: 2px solid var(--divider);
        grid-template-columns: 150px 1fr;
        gap: 24px;
        padding: 12px 0px 20px 20px;
        display: grid;
      }
      .time-label {
        color: var(--textSecondary);
      }
      .bar-row {
        grid-template-columns: minmax(80px, 1fr) 2fr minmax(80px, 1fr);
        align-items: center;
        gap: 12px;
        margin: 16px 0px;
        font-size: 13px;
        display: grid;
      }
      .bar-track {
        background: var(--accentSubtle);
        border-radius: 4px;
        height: 12px;
      }
      .bar {
        background: var(--accent);
        border-radius: 3px;
        height: 12px;
      }
      .diverging {
        position: relative;
      }
      .diverging::before {
        content: '';
        border-left: 1px solid var(--textSecondary);
        height: 100%;
        position: absolute;
        left: 50%;
      }
      .generated-frame {
        border: 1px solid var(--divider);
        background: var(--contentSurface);
        border-radius: 10px;
        width: 100%;
        height: 390px;
      }
      .changes {
        background: var(--subtleSurface);
        border-radius: 10px;
        margin: 28px 0px 20px;
        padding: 18px 20px;
      }
      .changes .section-label {
        color: var(--textSecondary);
        margin: 0px 0px 12px;
        font-weight: 600;
      }
      .changes p {
        color: var(--textSecondary);
        margin: 8px 0px;
        padding-left: 23px;
        font-size: 14px;
      }
      .empty-work {
        text-align: center;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        max-width: 600px;
        min-height: 360px;
        margin: auto;
        padding: 40px 12px;
        display: flex;
      }
      .empty-symbol {
        background: var(--accentSubtle);
        width: 68px;
        height: 68px;
        color: var(--accent);
        border-radius: 20px;
        place-items: center;
        margin-bottom: 20px;
        display: grid;
      }
      .empty-work h1 {
        font-size: 25px;
      }
      .empty-work p {
        color: var(--textSecondary);
        max-width: 420px;
      }
      .manual-input {
        border-top: 1px dashed var(--divider);
        margin-top: 28px;
        padding-top: 16px;
      }
      .manual-input textarea {
        margin: 8px 0px 12px;
      }
      .explore-entry {
        margin: 24px 0px 0px;
      }
      .explore-toggle {
        color: var(--accent);
        background: var(--accentSubtle);
        border-color: rgba(0, 0, 0, 0);
      }
      .explore-toggle:hover {
        border-color: var(--accent);
        background: var(--accentSubtle);
      }
      .explore-toggle .rotated {
        transform: rotate(90deg);
      }
      .ask-bar {
        border: 1px solid var(--accent);
        background: var(--contentSurface);
        box-shadow: 0 0 0 3px var(--accentSubtle);
        border-radius: 12px;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 14px 0px 28px;
        padding: 18px 20px;
        display: flex;
      }
      .ask-bar textarea {
        resize: vertical;
        border: 0px;
        flex: 1 1 0%;
        min-width: 160px;
        min-height: 48px;
        max-height: 160px;
        margin: 0px;
        padding: 8px 0px;
      }
      .ask-bar > button {
        white-space: nowrap;
      }
      .explore-note,
      .scope-note {
        color: var(--textSecondary);
        font-size: 12px;
      }
      .explore-note {
        flex-basis: 100%;
        margin: 0px;
      }
      .context-chip {
        border: 1px solid var(--divider);
        background: var(--subtleSurface);
        max-width: 100%;
        color: var(--textSecondary);
        border-radius: 6px;
        align-items: center;
        gap: 7px;
        padding: 3px 6px 3px 8px;
        font-size: 12px;
        display: inline-flex;
      }
      .context-chip > span {
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }
      .context-chip button {
        background: 0px 0px;
        border: 0px;
        min-height: 24px;
        padding: 3px;
      }
      .ask-context-note {
        color: var(--warning);
        flex-basis: 100%;
        margin: 0px;
        font-size: 12px;
      }
      .banner {
        border-radius: 10px;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        max-width: 1120px;
        margin: 16px auto;
        padding: 12px 18px;
        font-size: 13px;
        display: flex;
      }
      .banner.error {
        background: var(--errorSurface);
        color: var(--error);
      }
      .banner.warning {
        background: var(--warningSurface);
        color: var(--warning);
      }
      .warning-text,
      .stale {
        color: var(--warning);
      }
      .error-text {
        color: var(--error);
      }
      .update-notice {
        background: var(--accentSubtle);
        border-radius: 10px;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding: 12px 16px;
        font-size: 13px;
        display: flex;
      }
      .version-list {
        gap: 10px;
        max-width: 1120px;
        margin: 0px auto 16px;
        display: flex;
        overflow: auto;
      }
      .version-list button {
        white-space: nowrap;
        font-size: 12px;
      }
      .artifact-actions,
      .button-row {
        flex-wrap: wrap;
        gap: 12px;
        display: flex;
      }
      .artifact-actions {
        margin-top: 20px;
      }
      .artifact-actions button {
        font-size: 13px;
      }
      .source-drawer {
        background: var(--contentSurface);
        border-left: 1px solid var(--divider);
        z-index: 5;
        width: 400px;
        max-width: 94vw;
        padding: 28px;
        position: fixed;
        top: 0px;
        bottom: 0px;
        right: 0px;
        overflow: auto;
        box-shadow: rgba(16, 24, 40, 0.04) -8px 0px 32px;
      }
      .source-drawer[hidden] {
        display: none;
      }
      .drawer-intro {
        color: var(--textTertiary);
        border-bottom: 1px solid var(--divider);
        padding-bottom: 20px;
        font-size: 13px;
      }
      .source-card {
        border-bottom: 1px solid var(--divider);
        padding: 20px 0px;
      }
      .source-card .muted {
        margin-top: 12px;
        font-size: 13px;
      }
      .source-card blockquote {
        background: var(--subtleSurface);
        border-left: 2px solid var(--accent);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-radius: 0px 8px 8px 0px;
        margin: 10px 0px 14px;
        padding: 16px;
        font-size: 15px;
        line-height: 1.75;
      }

          <option value="ready">服务就绪（演示）</option>
          <option value="history">已有会议（示例）</option></select
        ><button class="restore" id="resetPreview" aria-label="重置预览">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-rotate-ccw"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </footer>
    <div id="previewToast" class="preview-toast" role="status" hidden></div>
    <script>
      const captured = {
        settings:
          '<div class="modal-backdrop"><div class="modal settings-modal " role="dialog" aria-modal="true" aria-label="设置"><div class="modal-title"><h2>设置</h2><button aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div><p class="settings-intro">按你的习惯，设置收听、语言和显示方式。</p><div class="settings-layout"><nav class="settings-nav" aria-label="设置"><button aria-current="location"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic" aria-hidden="true"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect></svg>会议音频</button><button><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-languages" aria-hidden="true"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>语言</button><button><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg>显示与体验</button></nav><div class="settings-content"><section class="settings-section" id="settings-audio"><h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic" aria-hidden="true"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect></svg>会议音频</h3><label>麦克风<select><option value="default">系统默认麦克风</option></select></label><label class="check"><input type="checkbox">同时收听电脑声音</label><p class="privacy">开始后，音频将发送至配置的转写服务；原话和生成内容保存在本机应用数据中。保存设置不会录音。</p><p class="warning-text">尚未配置语音转写服务，无法开始采音。</p></section><section class="settings-section" id="settings-language"><h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-languages" aria-hidden="true"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>语言</h3><label>界面语言<select aria-label="界面语言" aria-describedby="interface-language-hint" aria-busy="false" aria-disabled="false"><option value="system">跟随系统</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></label><p id="interface-language-hint" class="settings-field-hint" role="status">选择后立即生效并自动保存。</p><label>默认输出语言<select aria-label="默认输出语言"><option value="system">跟随系统</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></label></section><section class="settings-section" id="settings-experience"><h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg>显示与体验</h3><label class="check"><input type="checkbox" checked="">显示桌面悬浮球</label><small>隐藏后，会议提醒改用系统通知。正在进行的记录不受影响。</small><label class="check"><input type="checkbox" checked="">发现会议时提醒我</label><small>只有点击提醒后才会开始记录。</small><label class="check"><input type="checkbox" name="reduceMotion">减少动态效果</label><label class="check"><input type="checkbox">减少透明度</label><label>显示／隐藏快捷键（可选）<input value=""></label><small>例如 CommandOrControl+Shift+M；留空则不注册全局快捷键。</small></section><details class="settings-diagnostics selectable-text"><summary>处理详情</summary><section class="settings-section"><h3>服务配置</h3><p>从 .env.example 创建本地 .env 文件，设置自己的 API 凭证并重启。凭证只在可信服务中使用，不模拟模型输出。</p><p class="muted">gpt-4.1-mini · api.openai.com<br>api.openai.com</p></section><section class="settings-section"><h3>平台能力</h3><p>darwin · 27.0.0<br>CoreAudio loopback + microphone</p><small>只在开始输入时请求系统权限。</small></section></details></div></div><div class="settings-footer"><div role="status" class="settings-save-status"><span>更改会自动保存。</span></div><button class="primary">完成</button></div></div></div>',
      };
      const icons = {
        ChevronRight:
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right row-chevron" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>',
        LoaderCircle:
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle lucide-loader-2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>',
        Search:
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>',
        FileText:
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>',
        Clock3:
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock-3" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6h4"></path></svg>',
        RotateCcw:
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>',
      };
      const $ = (s) => document.querySelector(s);
      let state = 'captured',
        filter = 'all',
        search = '',
        computer = false,
        microphone = 'default',
        lastFocus = null,
        toastTimer = null,
        starting = false;
      const app = $('.app-shell');
      const originalEmpty = $('.library-empty').outerHTML;
      const startContent = $('.start-button').innerHTML;
      const originalWarning = $('.setup-note').outerHTML;
      const rows = [
        {
          id: 'one',
          title: '产品方案讨论',
          when: '9月12日 10:30',
          mode: '麦克风',
          status: 'stopped',
        },
        {
          id: 'two',
          title: '上线计划沟通',
          when: '9月11日 16:00',
          mode: '麦克风 + 电脑声音',
          status: 'stopped',
        },
      ];
      function toast(msg) {
        const t = $('#previewToast');
        t.textContent = msg;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.hidden = true), 2800);
      }
      function updateDevice() {
        const summary = $('.device-summary');
        summary.querySelector('div span').textContent =
          microphone === 'default' ? '系统默认麦克风' : '外接麦克风（示例）';
        summary.querySelector('button').innerHTML =
          (computer ? '麦克风与电脑声音' : '仅麦克风') +
          '<span aria-hidden="true">·</span>更改' +
          icons.ChevronRight;
      }
      function bindHome() {
        app.querySelector('.toolbar [aria-label="设置"]').onclick = () => openSettings();
        app.querySelector('.toolbar [aria-label="关闭"]').onclick = () => {
          app.hidden = true;
          $('#hiddenShell').hidden = false;
        };
        app.querySelector('.device-summary button').onclick = () => openSettings('audio');
        app.querySelector('.start-button').onclick = () => {
          if (starting) return;
          if (state === 'captured') {
            openSettings('audio');
            return;
          }
          starting = true;
          const b = $('.start-button');
          b.disabled = true;
          b.innerHTML = icons.LoaderCircle + '正在连接…';
          setTimeout(() => {
            starting = false;
            b.disabled = false;
            b.innerHTML = startContent;
            toast('首屏交互演示：正式应用会从这里进入会议工作页。没有开始录音。');
          }, 650);
        };
        const setup = app.querySelector('.setup-note button');
        if (setup) setup.onclick = () => openSettings('service');
      }
      function historyHtml() {
        return (
          '<div class="library-tools"><nav class="view-tabs" aria-label="筛选会议"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="active" aria-pressed="false">进行中</button><button data-filter="ended" aria-pressed="false">已结束</button></nav><label class="search-field">' +
          icons.Search +
          '<input aria-label="搜索会议" id="historySearch" placeholder="搜索会议" value=""></label></div><div class="meeting-list" id="historyList"></div>'
        );
      }
      function renderRows() {
        const list = $('#historyList');
        if (!list) return;
        const shown = rows.filter((r) => filter !== 'active' && r.title.includes(search));
        list.innerHTML = shown.length
          ? shown
              .map(
                (r) =>
                  '<button class="meeting-row" data-record="' +
                  r.id +
                  '"><span class="meeting-file">' +
                  icons.FileText +
                  '</span><div class="meeting-row-content"><strong>' +
                  r.title +
                  '</strong><p>' +
                  icons.Clock3 +
                  r.when +
                  '<span>·</span>' +
                  r.mode +
                  '</p></div><span class="status status-stopped"><i class="dot stopped"></i>已停止</span>' +
                  icons.ChevronRight +
                  '</button>',
              )
              .join('')
          : '<div class="no-results">' +
            icons.Search +
            '<p>没有符合条件的会议</p><button class="source-link" id="clearFilters">清除筛选</button></div>';
        list
          .querySelectorAll('[data-record]')
          .forEach(
            (el) =>
              (el.onclick = () => toast('这是一条合成记录，用于查看现有会议列表的视觉效果。')),
          );
        const clear = $('#clearFilters');
        if (clear)
          clear.onclick = () => {
            filter = 'all';
            search = '';
            $('#historySearch').value = '';
            updateFilters();
            renderRows();
          };
      }
      function updateFilters() {
        document
          .querySelectorAll('[data-filter]')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));
      }
      function changeState(value) {
        state = value;
        filter = 'all';
        search = '';
        const recent = $('.recent-meetings');
        recent
          .querySelectorAll('.library-empty,.library-tools,.meeting-list')
          .forEach((el) => el.remove());
        const note = $('.setup-note');
        if (note) note.remove();
        if (state === 'captured') recent.insertAdjacentHTML('beforebegin', originalWarning);
        if (state === 'history') {
          recent.insertAdjacentHTML('beforeend', historyHtml());
          $('#historySearch').oninput = (e) => {
            search = e.target.value;
            renderRows();
          };
          recent.querySelectorAll('[data-filter]').forEach(
            (b) =>
              (b.onclick = () => {
                filter = b.dataset.filter;
                updateFilters();
                renderRows();
              }),
          );
          renderRows();
        } else recent.insertAdjacentHTML('beforeend', originalEmpty);
        $('#previewState').value = state;
        $('#previewTruth').textContent =
          state === 'history' ? '示例记录 · 不录音' : '独立预览 · 不录音';
        bindHome();
        updateDevice();
      }
      function setView(on) {
        document.documentElement.dataset.polish = on ? 'on' : 'off';
        $('#currentView').setAttribute('aria-pressed', String(!on));
        $('#polishedView').setAttribute('aria-pressed', String(on));
      }
      function visibleFocusables(root) {
        return Array.from(
          root.querySelectorAll('button,input,select,summary,[tabindex="0"]'),
        ).filter((el) => !el.disabled && el.getClientRects().length > 0);
      }
      function closeSettings() {
        const host = $('#modalHost');
        host.innerHTML = '';
        app.inert = false;
        $('#previewBar').inert = false;
        lastFocus?.focus();
      }
      function openSettings(section = 'audio') {
        lastFocus = document.activeElement;
        const host = $('#modalHost');
        host.innerHTML = captured.settings;
        app.inert = true;
        $('#previewBar').inert = true;
        const modal = host.querySelector('[role="dialog"]');
        const audio = host.querySelector('#settings-audio');
        const select = audio.querySelector('select');
        select.innerHTML =
          '<option value="default">系统默认麦克风</option><option value="external">外接麦克风（示例设备）</option>';
        select.value = microphone;
        select.onchange = (e) => {
          microphone = e.target.value;
          updateDevice();
          saveMessage();
        };
        const check = audio.querySelector('input[type="checkbox"]');
        check.checked = computer;
        check.onchange = (e) => {
          computer = e.target.checked;
          updateDevice();
          saveMessage();
        };
        host.querySelector('.settings-save-status').textContent =
          '仅在本预览中生效，不会录音或修改应用设置。';
        host.querySelector('.modal-title button').onclick = closeSettings;
        host.querySelector('.settings-footer button').onclick = closeSettings;
        host.querySelector('.modal-backdrop').onclick = (e) => {
          if (e.target === e.currentTarget) closeSettings();
        };
        const sectionIds = ['settings-audio', 'settings-language', 'settings-experience'];
        host.querySelectorAll('.settings-nav button').forEach(
          (b, i) =>
            (b.onclick = () => {
              host
                .querySelectorAll('.settings-nav button')
                .forEach((x) => x.removeAttribute('aria-current'));
              b.setAttribute('aria-current', 'location');
              host
                .querySelector('#' + sectionIds[i])
                .scrollIntoView({ block: 'start', behavior: 'auto' });
            }),
        );
        host.querySelectorAll('input,select').forEach((el) => {
          if (el !== select && el !== check) el.addEventListener('change', () => saveMessage());
        });
        if (section === 'service') {
          host.querySelector('details').open = true;
          host.querySelector('details').scrollIntoView({ block: 'start' });
        }
        modal.querySelector('button').focus();
        host.onkeydown = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            closeSettings();
          } else if (e.key === 'Tab') {
            const els = visibleFocusables(modal),
              first = els[0],
              last = els[els.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };
      }
      function saveMessage() {
        const s = $('.settings-save-status');
        if (s) s.textContent = '已保留本次预览选择。正式应用设置未更改。';
      }
      $('#currentView').onclick = () => setView(false);
      $('#polishedView').onclick = () => setView(true);
      $('#previewState').onchange = (e) => changeState(e.target.value);
      $('#resetPreview').onclick = () => {
        computer = false;
        microphone = 'default';
        setView(true);
        changeState('captured');
      };
      $('#restoreWindow').onclick = () => {
        app.hidden = false;
        $('#hiddenShell').hidden = true;
      };
      $('#hiddenShell').hidden = true;
      bindHome();
    </script>
  </body>
</html>
