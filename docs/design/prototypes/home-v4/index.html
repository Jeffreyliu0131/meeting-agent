<!doctype html>
<html lang="zh-CN" data-role="workspace" data-polish="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>当前首页 · 客户端视觉优化</title>
    <style id="currentStyles">
      .collaboration-panel {
        border-top: 1px solid var(--divider, #dde4ee);
        color: var(--text-primary, #101828);
        margin-block: 24px;
        padding: 20px;
      }
      .collaboration-index {
        border-bottom: 1px solid rgb(221, 228, 238);
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 0px;
        display: flex;
      }
      html[data-role='component'],
      html[data-role='component'] body {
        background: rgb(246, 248, 251);
        overflow: auto;
      }
      .launcher-component-badge {
        z-index: 3;
        color: rgb(255, 255, 255);
        text-align: center;
        pointer-events: none;
        background: rgb(36, 99, 216);
        border-radius: 9px;
        min-width: 16px;
        height: 16px;
        padding: 0px 3px;
        font: 700 10px / 16px system-ui;
        position: absolute;
        top: 1px;
        right: 0px;
        box-shadow: rgb(255, 255, 255) 0px 0px 0px 2px;
      }
      .launcher-component-notices {
        background: rgb(238, 245, 255);
        border-radius: 8px;
        gap: 4px;
        padding: 8px;
        display: grid;
      }
      .launcher-component-notices button {
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 3px 5px;
        font-size: 13px;
        overflow: hidden;
      }
      .collaboration-panel h2 {
        margin: 0px 0px 6px;
        font-size: 22px;
      }
      .collaboration-panel h3 {
        margin: 12px 0px;
        font-size: 19px;
        line-height: 1.45;
      }
      .collaboration-panel header,
      .collaboration-toolbar,
      .collaboration-card footer {
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        display: flex;
      }
      .collaboration-panel small {
        color: rgb(71, 84, 103);
        font-size: 13px;
      }
      .collaboration-toolbar {
        margin: 16px 0px;
      }
      .collaboration-card {
        overflow-wrap: anywhere;
        background: rgb(255, 255, 255);
        border: 1px solid rgb(221, 228, 238);
        border-radius: 12px;
        margin: 20px 0px;
        padding: 24px;
      }
      .collaboration-card header {
        border-bottom: 1px solid rgb(233, 238, 245);
        padding-bottom: 12px;
      }
      .collaboration-editor {
        gap: 14px;
        margin-top: 18px;
        display: grid;
      }
      .collaboration-panel label {
        gap: 6px;
        font-size: 14px;
        display: grid;
      }
      .collaboration-panel input:not([type='radio']):not([type='checkbox']),
      .collaboration-panel select,
      .collaboration-panel textarea {
        box-sizing: border-box;
        color: rgb(16, 24, 40);
        width: 100%;
        min-width: 0px;
        max-width: 100%;
        font: inherit;
        background: rgb(255, 255, 255);
        border: 1px solid rgb(122, 135, 152);
        border-radius: 8px;
        padding: 9px 12px;
      }
      .collaboration-panel textarea {
        resize: vertical;
        min-height: 74px;
      }
      .collaboration-panel .inline {
        align-items: center;
        gap: 10px;
        margin: 10px 0px;
        display: flex;
      }
      .collaboration-panel input[type='radio'],
      .collaboration-panel input[type='checkbox'] {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
      }
      .collaboration-panel fieldset {
        border: 1px solid rgb(221, 228, 238);
        border-radius: 8px;
        min-width: 0px;
        padding: 12px 16px;
      }
      .collaboration-panel button {
        white-space: normal;
        min-height: 36px;
        margin: 4px 6px 4px 0px;
      }
      .collaboration-publish {
        margin-block: 16px;
      }
      .collaboration-result {
        background: rgb(238, 245, 255);
        border-radius: 8px;
        margin-top: 16px;
        padding: 16px;
      }
      .collaboration-error {
        color: rgb(180, 35, 24);
      }
      .collaboration-warning {
        color: rgb(146, 64, 14);
        background: rgb(255, 244, 230);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .assignment-list {
        gap: 12px;
        display: grid;
      }
      .assignment-list > section {
        border-bottom: 1px solid rgb(221, 228, 238);
        padding: 12px 0px;
      }
      .conflict-sides {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        display: grid;
      }
      .conflict-sides > section {
        background: rgb(248, 250, 253);
        padding: 16px;
      }
      .participant-page {
        max-width: 800px;
        margin: auto;
        padding: 24px;
      }
      .collaboration-panel :focus-visible {
        outline-offset: 2px;
        outline: rgb(36, 99, 216) solid 2px;
      }
      html[data-role='participant'],
      html[data-role='participant'] body {
        background: rgb(246, 248, 251);
        overflow: auto;
      }
      .collaboration-panel p,
      .collaboration-panel h3 {
        user-select: text;
      }
      @media (width <= 720px) {
        .collaboration-card {
          padding: 16px;
        }
        .participant-page {
          padding: 12px;
        }
        .conflict-sides {
          grid-template-columns: 1fr;
        }
        .collaboration-toolbar {
          align-items: stretch;
        }
      }
      :root {
        color: var(--textPrimary);
        background: var(--appBackground);
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      * {
        box-sizing: border-box;
      }
      body {
        user-select: none;
        cursor: default;
        margin: 0px;
      }
      .artifact-blocks,
      .source-card blockquote,
      .translated,
      .focus-title,
      .focus-summary,
      .calculation-result,
      .meeting-review ul,
      .selectable-text,
      [role='alert'],
      input,
      textarea,
      [contenteditable='true'] {
        user-select: text;
      }
      button,
      summary,
      label,
      .provenance {
        user-select: none;
      }
      button svg {
        pointer-events: none;
      }
      select,
      summary,
      label.check {
        cursor: pointer;
      }
      select[aria-disabled='true'] {
        cursor: progress;
      }
      .settings-field-hint {
        color: var(--textSecondary);
        margin: -4px 0px 18px;
        font-size: 13px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--controlBorder);
        background: var(--contentSurface);
        cursor: pointer;
        border-radius: 10px;
        justify-content: center;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 8px 14px;
        font-weight: 500;
        line-height: 1.4;
        transition:
          background-color 0.15s,
          border-color 0.15s;
        display: inline-flex;
      }
      button svg {
        flex-shrink: 0;
      }
      button:hover:not(:disabled) {
        background: var(--subtleSurface);
        border-color: var(--textSecondary);
      }
      button:disabled {
        color: var(--disabledText);
        opacity: 0.65;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .primary {
        background: var(--accent);
        color: rgb(255, 255, 255);
        border-color: var(--accent);
        min-height: 44px;
        padding: 10px 20px;
        box-shadow: rgba(16, 24, 40, 0.05) 0px 1px 2px;
      }
      .primary:hover:not(:disabled) {
        background: rgb(29, 82, 183);
        border-color: rgb(29, 82, 183);
      }
      .primary:disabled {
        color: rgb(255, 255, 255);
      }
      .danger {
        color: var(--error);
        background: var(--errorSurface);
        border-color: rgba(0, 0, 0, 0);
      }
      .danger:hover:not(:disabled) {
        border-color: var(--error);
        background: var(--errorSurface);
      }
      .text-button,
      .source-link,
      .cite {
        color: var(--accent);
        box-shadow: none;
        background: 0px 0px;
        border-color: rgba(0, 0, 0, 0);
        padding: 6px 8px;
      }
      .text-button:hover,
      .source-link:hover,
      .cite:hover {
        background: var(--accentSubtle);
        border-color: rgba(0, 0, 0, 0);
      }
      .source-link {
        min-height: 30px;
        font-size: 13px;
      }
      .cite {
        float: right;
        min-height: 28px;
        padding: 2px 6px;
      }
      h1 {
        letter-spacing: -0.8px;
        overflow-wrap: anywhere;
        margin: 14px 0px 16px;
        font-size: 32px;
        font-weight: 600;
        line-height: 1.25;
      }
      h2 {
        letter-spacing: -0.35px;
        margin: 0px 0px 12px;
        font-size: 21px;
        font-weight: 600;
        line-height: 1.35;
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 8px 0px 16px;
      }
      small,
      .muted,
      .eyebrow,
      .section-label {
        color: var(--textTertiary);
      }
      small,
      .eyebrow,
      .section-label {
        font-size: 12px;
      }
      .eyebrow,
      .section-label {
        align-items: center;
        gap: 8px;
        display: flex;
      }
      .lead {
        color: var(--textSecondary);
        max-width: 760px;
        font-size: 17px;
        line-height: 1.7;
      }
      .app-shell {
        min-height: 100vh;
        padding-bottom: 48px;
      }
      .toolbar {
        border-bottom: 1px solid var(--divider);
        background: var(--contentSurface);
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        min-height: 64px;
        padding: 12px 28px;
        display: flex;
      }
      .brand {
        letter-spacing: -0.3px;
        white-space: nowrap;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        display: flex;
      }
      .brand-mark {
        background: var(--accent);
        color: rgb(255, 255, 255);
        border-radius: 10px;
        place-items: center;
        width: 32px;
        height: 32px;
        display: grid;
      }
      .brand-subtitle {
        color: var(--textTertiary);
        border-left: 1px solid var(--divider);
        font-size: 12px;
      }
      .toolbar-divider {
        border-left: 1px solid var(--divider);
        height: 20px;
      }
      .meeting-name {
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
        max-width: 350px;
        color: var(--textPrimary);
        font-weight: 600;
        display: block;
        overflow: hidden;
      }
      .back-button {
        color: var(--textSecondary);
      }
      .toolbar-actions {
        align-items: center;
        gap: 8px;
        margin-left: auto;
        display: flex;
      }
      .toolbar-actions > .text-button {
        color: var(--textSecondary);
        width: 36px;
        padding: 8px;
      }
      .status {
        color: var(--textSecondary);
        background: var(--subtleSurface);
        white-space: nowrap;
        border-radius: 6px;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
      }
      .status-capturing {
        color: var(--listening);
        background: var(--successSurface);
      }
      .status-paused,
      .status-starting {
        color: var(--warning);
        background: var(--warningSurface);
      }
      .status-input_error {
        color: var(--error);
        background: var(--errorSurface);
      }
      .dot {
        background: var(--textTertiary);
        border-radius: 50%;
        flex-shrink: 0;
        width: 6px;
        height: 6px;
        display: inline-block;
      }
      .dot.capturing {
        background: var(--listening);
      }
      .dot.paused,
      .dot.starting {
        background: var(--warning);
      }
      .dot.input_error {
        background: var(--error);
      }
      .library {
        max-width: 1120px;
        margin: auto;
        padding: 48px 32px 40px;
      }
      .home-hero {
        border: 1px solid var(--divider);
        background: var(--contentSurface);
        border-radius: 18px;
        padding: 44px 48px 36px;
        box-shadow: rgba(16, 24, 40, 0.008) 0px 2px 5px;
      }
      .hero-kicker {
        color: var(--accent);
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
      }
      .home-hero h1 {
        max-width: 660px;
        margin-top: 0px;
      }
      .home-hero .lead {
        max-width: 650px;
        margin: 0px;
      }
      .start-row {
        flex-wrap: wrap;
        align-items: center;
        gap: 28px;
        margin-top: 30px;
        display: flex;
      }
      .start-button {
        gap: 12px;
        min-height: 48px;
        padding: 12px 22px;
      }
      .start-button svg:last-child {
        margin-left: 16px;
      }
      .device-summary {
        color: var(--textSecondary);
        font-size: 13px;
      }
      .device-summary > div {
        align-items: center;
        gap: 7px;
        display: flex;
      }
      .device-summary .source-link {
        min-height: 26px;
        color: var(--textTertiary);
        gap: 6px;
        padding: 2px 0px;
        font-size: 12px;
      }
      .hero-footnote {
        color: var(--textTertiary);
        margin: 24px 0px 0px;
        font-size: 12px;
      }
      .setup-note {
        background: var(--warningSurface);
        color: var(--warning);

        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 20px 0px;
        padding: 16px 20px;
        font-size: 13px;
        display: flex;
      }
      .setup-note strong {
        font-weight: 600;
      }
      .setup-note p {
        flex: 1 1 0%;
        min-width: 200px;
        margin: 0px;
      }
      .setup-note .source-link {
        color: var(--warning);
      }
      .recent-meetings {
        margin-top: 40px;
      }
      .recent-heading {
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 0px 2px 16px;
        display: flex;
      }
      .recent-heading h2 {
        margin: 0px;
        font-size: 18px;
      }
      .recent-heading > span {
        color: var(--textTertiary);
        font-size: 12px;
      }
      .meeting-list {
        background: var(--contentSurface);
        border: 1px solid var(--divider);
        border-radius: 14px;
        overflow: hidden;
      }
      .meeting-row {
        border-top: 0px;
        border-right: 0px;
        border-left: 0px;
        border-image: none;
        border-bottom: 1px solid var(--subtleDivider);
        text-align: left;
        border-radius: 0px;
        justify-content: flex-start;
        gap: 18px;
        width: 100%;
        min-height: 88px;
        padding: 20px 24px;
      }
      .meeting-row:last-child {
        border-bottom: 0px;
      }
      .meeting-row:hover {
        background: var(--selectedSurface);
      }
      .meeting-file,
      .quiet-icon {
        width: 42px;
        height: 44px;
        color: var(--textTertiary);
        background: var(--subtleSurface);
        border: 1px solid var(--subtleDivider);
        border-radius: 10px;
        flex-shrink: 0;
        place-items: center;
        display: grid;
      }
      .meeting-file.is-active {
        color: var(--accent);
        background: var(--accentSubtle);
      }
      .meeting-row-content {
        flex: 1 1 0%;
        min-width: 0px;
      }
      .meeting-row strong {
        overflow-wrap: anywhere;
        font-weight: 500;
      }
      .meeting-row p {
        color: var(--textTertiary);
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin: 7px 0px 0px;
        font-size: 12px;
        font-weight: 400;
        display: flex;
      }
      .row-chevron {
        color: var(--textTertiary);
      }
      .library-empty {
        border: 1px dashed var(--divider);
        border-radius: 14px;
        align-items: center;
        gap: 18px;
        padding: 32px;
        display: flex;
      }
      .library-empty strong {
        font-size: 14px;
        font-weight: 500;
      }
      .library-empty p {
        color: var(--textTertiary);
        margin: 5px 0px 0px;
        font-size: 13px;
      }
      .library > details {
        color: var(--textTertiary);
        font-size: 12px;
      }
      .workspace-meta {
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        max-width: 1120px;
        margin: auto;
        padding: 22px 4px 16px;
        font-size: 12px;
        display: flex;
      }
      .meta-actions {
        flex-wrap: wrap;
        gap: 8px;
        display: flex;
      }
      .meta-actions button {
        color: var(--textSecondary);
        min-height: 32px;
        font-size: 12px;
      }
      .workspace {
        border: 1px solid var(--divider);
        background: var(--contentSurface);
        border-radius: 16px;
        max-width: 1120px;
        min-height: 480px;
        margin: 0px auto;
        padding: 36px 40px;
        box-shadow: rgba(16, 24, 40, 0.008) 0px 2px 5px;
      }
      .focus-label {
        color: var(--accent);
        align-items: center;
        gap: 7px;
        font-weight: 500;
        display: inline-flex;
      }
      .focus-title {
        max-width: 940px;
        margin-top: 14px;
      }
      .focus-summary {
        margin-bottom: 28px;
      }
      .artifact-blocks {
        margin-top: 32px;
      }
      .artifact-blocks.columns {
        grid-template-columns: repeat(2, minmax(0px, 1fr));
        gap: 28px;
        display: grid;
      }
      .expression {
        border-top: 1px solid var(--subtleDivider);
        min-width: 0px;
        margin-bottom: 32px;
        padding-top: 24px;
        transition: background-color 0.18s;
      }
      .expression-heading {
        justify-content: space-between;
        align-items: start;
        gap: 16px;
        display: flex;
      }
      .expression-heading h2 {
        margin: 0px;
        font-size: 20px;
      }
      .expression-heading .source-link {
        flex-shrink: 0;
        margin-top: -3px;
      }
      .provenance {
        color: var(--textTertiary);
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 10px 0px 20px;
        font-size: 12px;
        display: flex;
      }
      .provenance .semantic-state {
        color: var(--warning);
        background: var(--warningSurface);
        border-radius: 5px;
        padding: 2px 7px;
      }
      .provenance .state-confirmed {
        color: var(--listening);
        background: var(--successSurface);
      }
      .provenance .state-disputed {
        color: var(--error);
        background: var(--errorSurface);
      }

        padding: 0px;
        list-style: none;
      }
      .expression ul:not(.plain-list) {
        padding-left: 22px;
      }
      .expression li {
        margin-bottom: 12px;
      }
      .expression-changed {
        background-color: var(--selectedSurface);
      }
      .table-scroll {
        border: 1px solid var(--divider);
        border-radius: 10px;
        overflow-x: auto;
      }

        border-collapse: collapse;
        text-align: left;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        border-bottom: 1px solid var(--subtleDivider);
        vertical-align: top;
        overflow-wrap: anywhere;
        min-width: 130px;
        padding: 16px 18px;
      }
      th {
        background: var(--subtleSurface);
        color: var(--textSecondary);
        font-weight: 600;
      }
      td:first-child {
        color: var(--textSecondary);
        font-weight: 500;
      }
      tbody tr:last-child td {
        border-bottom: 0px;
      }
      tbody tr:hover {
        background: var(--subtleSurface);
      }

        padding: 0px;
        list-style: none;
      }

        border-left: 2px solid var(--divider);
        grid-template-columns: 150px 1fr;
        gap: 24px;
        padding: 12px 0px 20px 20px;
        display: grid;
      }
      .time-label {
        color: var(--textSecondary);
      }
      .bar-row {
        grid-template-columns: minmax(80px, 1fr) 2fr minmax(80px, 1fr);

        gap: 12px;
        margin: 16px 0px;
        font-size: 13px;
        display: grid;
      }
      .bar-track {
        background: var(--accentSubtle);
        border-radius: 4px;
        height: 12px;
      }

        background: var(--accent);
        border-radius: 3px;
        height: 12px;
      }

        position: relative;
      }

        content: '';
        border-left: 1px solid var(--textSecondary);
        height: 100%;
        position: absolute;
        left: 50%;
      }

        border: 1px solid var(--divider);
        background: var(--contentSurface);
        border-radius: 10px;
        width: 100%;
        height: 390px;
      }

        background: var(--subtleSurface);
        border-radius: 10px;
        margin: 28px 0px 20px;
        padding: 18px 20px;
      }

        color: var(--textSecondary);
        margin: 0px 0px 12px;
        font-weight: 600;
      }
      .changes p {
        color: var(--textSecondary);
        margin: 8px 0px;
        padding-left: 23px;
        font-size: 14px;
      }

        text-align: center;

          if (e.target === e.currentTarget) closeSettings();
        };
        const ids = ['settings-audio', 'settings-language', 'settings-experience'];
        host.querySelectorAll('.settings-nav button').forEach(
          (b, i) =>
            (b.onclick = () => {
              host
                .querySelectorAll('.settings-nav button')
                .forEach((x) => x.removeAttribute('aria-current'));
              b.setAttribute('aria-current', 'location');
              host.querySelector('#' + ids[i]).scrollIntoView({ block: 'start' });
            }),
        );
        host.querySelectorAll('input,select').forEach((el) => {
          if (el !== select && el !== check) el.onchange = saveMessage;
        });
        if (section === 'service') {
          host.querySelector('details').open = true;
          host.querySelector('details').scrollIntoView({ block: 'start' });
        }
        modal.querySelector('button').focus();
        host.onkeydown = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            closeSettings();
          } else if (e.key === 'Tab') {
            const els = Array.from(
                modal.querySelectorAll('button,input,select,summary,[tabindex="0"]'),
              ).filter((x) => !x.disabled && x.getClientRects().length),
              first = els[0],
              last = els[els.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };
      }
      $('#currentView').onclick = () => {
        enhanced = false;
        render();
      };
      $('#polishedView').onclick = () => {
        enhanced = true;
        render();
      };
      $('#previewState').onchange = (e) => {
        state = e.target.value;
        filter = 'all';
        search = '';
        render();
      };
      $('#resetPreview').onclick = () => {
        state = 'captured';
        enhanced = true;
        computer = false;
        microphone = 'default';
        filter = 'all';
        search = '';
        render();
      };
      $('#restoreWindow').onclick = () => {
        app.hidden = false;
        $('#hiddenShell').hidden = true;
      };
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#micChoice,#microphoneMenu')) closeMenu();
      });
      window.addEventListener('resize', closeMenu);
      render();
    </script>
  </body>
</html>
